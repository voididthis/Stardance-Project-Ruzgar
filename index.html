    <body>
               <input type="checkbox" id="button" style="display:none">
        <label for="button" style="padding:10px; background:#000; color:#fff; border:2px solid #000000; cursor:pointer; font-weight:bold;"> 
            <span class="Darkmode">Darkmode</span>
            <span class="Lightmode">Lightmode</span>
        </label>   
        <style>
            html:has(#button:checked) body {
                background-color: #000000;
                color: #fff;
                background-image: repeating-linear-gradient(0deg ,transparent , transparent 40px , #000000 40px, #000000 42px);
            }
            html:has(#button:checked) .Darkmode {display:none}
            html:has(#button:checked) .Lightmode {display:inline}
        </style>
